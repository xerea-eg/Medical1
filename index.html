<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام إدارة العيادة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--ink:#12262a;--mut:#63777a;--pri:#0f766e;--line:#dde6e4;--w:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font-family:inherit;font-size:14px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
.btn{border:0;background:var(--pri);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.g{background:#e6eeec;color:var(--ink)}.btn.r{background:#dc2626}.btn.s{padding:5px 10px;font-size:12px}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e,#0c4a44);position:relative;overflow:hidden}
.loginwrap:before{content:"\2695";position:absolute;font-size:480px;opacity:.07;color:#fff;top:-90px;right:-60px;line-height:1}
.login{max-width:360px;width:92%;margin:0;background:#fff;padding:32px 28px;border-radius:18px;box-shadow:0 20px 60px #0006;position:relative;z-index:1}
.login .ic{width:58px;height:58px;border-radius:50%;background:#e6f5f3;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin:10px 0}.chk input{width:auto}
.chip{display:inline-flex;align-items:center;gap:5px;background:#e6f5f3;color:#0f766e;border-radius:16px;padding:3px 10px;font-size:12px;margin:0 4px 4px 0}.chip span{cursor:pointer;font-weight:800}
.subnav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.shell{display:flex;min-height:100vh}.side{width:230px;background:#0c2a2c;color:#cfe3e0;padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side h3{margin:4px 8px 12px;color:#fff;font-size:16px}.side img{max-width:190px;max-height:110px;display:block;margin:0 8px 8px}
.side a{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}.side a.on,.side a:hover{background:#155e5e;color:#fff}
.main{flex:1;padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;border-right:6px solid var(--c);cursor:pointer;box-shadow:0 2px 10px #0000000d;position:relative}
.card:hover{box-shadow:0 6px 18px #0000001a}.card .n{position:absolute;left:12px;top:10px;background:var(--c);color:#fff;border-radius:20px;padding:0 10px;font-weight:800}
.card b{font-size:16px}.card small{display:block;color:var(--mut);margin-top:3px}.bd{display:inline-block;background:var(--c);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-top:8px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.booked{--c:#f59e0b}.confirmed{--c:#2563eb}.waiting{--c:#7c3aed}.results{--c:#db2777}.done{--c:#059669}.archive{--c:#64748b}.red{--c:#dc2626}.ok{--c:#059669}.part{--c:#f59e0b}
#modal,#rxm{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.mb{background:#fff;border-radius:14px;width:min(860px,100%);padding:20px}.mb h2{margin:0 0 6px}
.mb h4{margin:18px 0 4px;color:var(--pri);border-bottom:1px solid var(--line);padding-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.rxr{display:grid;grid-template-columns:2fr 1.2fr 2fr auto;gap:6px;margin-bottom:6px}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.alert{background:#fef3c7;border-right:5px solid #f59e0b;padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600}.empty{color:var(--mut);padding:30px;text-align:center}
@media(max-width:760px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow:auto}.side h3,.side img{display:none}.side a{white-space:nowrap}.rxr{grid-template-columns:1fr 1fr}}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp{margin:0!important;padding:10px 8px!important;text-align:center}.kl{color:var(--mut);font-size:12px}.kv{font-size:20px;font-weight:800}
.lr{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}.dz{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.dz>div{border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:13px}.dz>div.on{border-color:var(--pri);background:#e6f5f3;font-weight:700}
@media(max-width:760px){.kg{grid-template-columns:repeat(3,1fr);gap:6px}.kp{padding:7px 3px!important}.kl{font-size:11px}.kv{font-size:17px}.main{padding:12px}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="rxm"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,getDocs,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ضع الإعدادات هنا ====== */
const firebaseConfig={apiKey:"AIzaSyDtytTD5VHlK8VGgOoE_N-Q7c4ZiX2ntEU",authDomain:"xeria-eg.firebaseapp.com",projectId:"xeria-eg",storageBucket:"xeria-eg.firebasestorage.app",messagingSenderId:"1052466301432",appId:"1:1052466301432:web:e3cf0a591e63973d46ee0d"};
const APPS_URL="https://script.google.com/macros/s/AKfycbwwV0Buz3GSImjZwqv9HojeGlceTqK1kgyCcKaCc8qmmqfI-0POjbHWAIKOCzIUrAu7Jg/exec"; // رابط Google Apps Script (Web App) لرفع الملفات على درايف
/* ============================== */

const db=getFirestore(initializeApp(firebaseConfig));
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ST={booked:'محجوز',confirmed:'مؤكد',waiting:'في الانتظار',results:'انتظار نتائج',done:'تم الكشف',archive:'أرشيف'};
const ROLE={admin:'مدير',doctor:'طبيب',secretary:'سكرتارية'};
const ALL=['admin','doctor','secretary'];
const TABS=[['dash','📊 الرئيسية',ALL],['book','📅 الحجوزات',['admin','secretary']],['waiting','🩺 شاشة الطبيب',['admin','doctor']],['results','🧪 انتظار نتائج',['admin','doctor']],['done','✅ تم الكشف',['admin','doctor']],['ops','💰 الحسابات',['admin','secretary']],['archive','🗄 الأرشيف',ALL],['contracts','🤝 التعاقدات',['admin','secretary']],['fin','🏦 الالتزامات النقدية',['admin','secretary']],['set','⚙ الإعدادات',['admin']]];
let S={u:null,p:[],us:[],fin:[],drugs:[],labItems:[],rxbg:{},chargeItems:[],actionItems:[],pay:[],exp:[],contracts:[],refs:[],cfg:{},v:null,ops2:'عمليات'},D=null,rxOpen=false;
const BLANK=()=>({labs:[],labNote:'',status:'booked',type:'كشف جديد',notes:'',date:today(),time:'',name:'',phone:'',age:'',gender:'',hist:'',diag:'',enotes:'',chronic:[],charges:[],actions:[],rx:[],rxNote:'',files:[],res:{type:'',note:''},op:{name:'',type:'',total:'',paid:'',date:''}});

/* ---------- بيانات ---------- */
async function boot(){
  const us=await getDocs(collection(db,'users'));
  if(us.empty)await setDoc(doc(db,'users','admin'),{username:'admin',name:'المدير',role:'admin',ph:await sha('123123')});
  const uid=sessionStorage.uid;
  if(uid){const d=us.docs.find(x=>x.id===uid);if(d){S.u={...d.data(),id:d.id};listen()}}
  else{try{const r=JSON.parse(localStorage.getItem('rem')||'null');if(r){const d=us.docs.find(x=>x.data().username===r.u&&x.data().ph===r.h);if(d){sessionStorage.uid=d.id;S.u={...d.data(),id:d.id};listen()}}}catch{}}
  R();
}
window.addEventListener('beforeunload',ev=>{ev.preventDefault();ev.returnValue=''});
function listen(){
  onSnapshot(collection(db,'drugs'),s=>{S.drugs=s.docs.map(d=>d.data())});
  onSnapshot(collection(db,'labItems'),s=>{S.labItems=s.docs.map(d=>d.data()).sort((a,b)=>a.name.localeCompare(b.name,'ar'));R()});onSnapshot(doc(db,'settings','rxbg'),s=>{S.rxbg=s.data()||{};R()});
  onSnapshot(collection(db,'chargeItems'),s=>{S.chargeItems=s.docs.map(d=>d.data())});
  onSnapshot(collection(db,'actionItems'),s=>{S.actionItems=s.docs.map(d=>d.data())});
  onSnapshot(collection(db,'patients'),s=>{S.p=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'users'),s=>{S.us=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'fin'),s=>{S.fin=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'payments'),s=>{S.pay=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'expenses'),s=>{S.exp=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'contracts'),s=>{S.contracts=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(collection(db,'referrals'),s=>{S.refs=s.docs.map(d=>({...d.data(),id:d.id}));R()});
  onSnapshot(doc(db,'settings','clinic'),s=>{S.cfg=s.data()||{};R()});
}
const nextNum=()=>runTransaction(db,async t=>{const r=doc(db,'meta','counter'),s=await t.get(r),n=(s.exists()?s.data().n:0)+1;t.set(r,{n});return n});
window.login=async()=>{
  const us=await getDocs(collection(db,'users')),h=await sha($('#pw').value),u=us.docs.map(d=>({...d.data(),id:d.id})).find(x=>x.username===$('#un').value.trim()&&x.ph===h);
  if(!u)return alert('اسم المستخدم أو كلمة المرور غير صحيحة');
  if($('#rem')?.checked)localStorage.setItem('rem',JSON.stringify({u:u.username,h}));else localStorage.removeItem('rem');
  sessionStorage.uid=u.id;S.u=u;S.v=null;listen();R();
};
window.logout=()=>{sessionStorage.clear();localStorage.removeItem('rem');location.reload()};
window.chPw=async()=>{const p=prompt('كلمة المرور الجديدة');if(p){await updateDoc(doc(db,'users',S.u.id),{ph:await sha(p)});alert('تم التغيير')}};

/* ---------- الواجهة ---------- */
function R(){
  const A=$('#app');
  if(!S.u){A.innerHTML=`<div class="loginwrap"><div class="login"><div class="ic">🏥</div><h2 style="margin:0 0 2px;text-align:center">تسجيل الدخول</h2><div style="text-align:center;color:var(--mut);font-size:13px;margin-bottom:18px">نظام إدارة العيادة</div><label>اسم المستخدم</label><input id="un" value="admin"><label>كلمة المرور</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><label class="chk"><input type="checkbox" id="rem" checked>تذكر بياناتي على هذا الجهاز</label><button class="btn" style="width:100%;margin-top:8px" onclick="login()">دخول</button></div></div>`;return}
  const tabs=TABS.filter(t=>t[2].includes(S.u.role));if(!S.v||!tabs.find(t=>t[0]===S.v))S.v=tabs[0][0];
  const c=S.cfg;
  A.innerHTML=`<div class="shell"><div class="side"><img src="${c.logo||'logo.png.png'}" onerror="this.style.display='none'"><h3>${e(c.doctor||'العيادة')}<br><small style="font-weight:400;color:#8fb3b0">${e(c.spec||'')}</small></h3>
  ${tabs.map(t=>`<a class="${S.v===t[0]?'on':''}" onclick="S.v='${t[0]}';R()">${t[1]}</a>`).join('')}
  <div style="flex:1"></div><a onclick="chPw()">🔑 تغيير كلمة المرور</a><a onclick="logout()">⎋ خروج (${e(S.u.name)})</a></div><div class="main">${view()}</div></div>`;
}
window.S=S;window.R=R;
const list=(st)=>S.p.filter(p=>st.includes(p.status));
function card(p,acts=''){
  const cls=p.cls||p.status;
  return `<div class="card ${cls}" onclick="openP('${p.id}')">${p.num?`<span class="n">#${p.num}</span>`:''}<b>${e(p.name)}</b><small>${e(p.age?p.age+' سنة • ':'')}${e(p.phone||'')}</small><small>📅 ${e(p.date||'')} ${e(p.time||'')}</small>${p.bookedBy?`<small>👤 حجز بواسطة: ${e(p.bookedBy)}</small>`:''}${p.notes?`<small>📝 ${e(p.notes.slice(0,60))}</small>`:''}${p.diag&&isDoc()?`<small>🩺 ${e(p.diag.slice(0,50))}</small>`:''}<span class="bd">${p.badge||ST[p.status]}</span> ${tag(p)}<div class="acts" onclick="event.stopPropagation()">${acts}</div></div>`;
}
function examCard(p){
  return `<div class="card ${p.status}" onclick="openExam('${p.id}')">${p.num?`<span class="n">#${p.num}</span>`:''}<b>${e(p.name)}</b><small>${e(p.type||'كشف جديد')}</small>${p.bookedBy?`<small>👤 حجز بواسطة: ${e(p.bookedBy)}</small>`:''}<span class="bd">${ST[p.status]}</span> ${tag(p)}<div class="acts" onclick="event.stopPropagation()">${B('تفاصيل',`detail('${p.id}')`,'g')}</div></div>`;
}
const B=(t,fn,cl='')=>`<button class="btn s ${cl}" onclick="${fn}">${t}</button>`;
const grid=(a,f)=>a.length?`<div class="grid">${a.map(f).join('')}</div>`:`<div class="empty">لا توجد حالات هنا</div>`;
const kpi=(l,val,c)=>`<div class="box kp"><div class="kl">${l}</div><div class="kv" style="color:${c||'var(--ink)'}">${val}</div></div>`;
function statsGrid(hide){
  const d=today(),todayP=S.p.filter(p=>p.date===d);
  const waitingN=list(['waiting']).length,examN=todayP.filter(p=>p.type==='كشف جديد').length,followN=todayP.filter(p=>p.type==='متابعة').length,consultN=todayP.filter(p=>p.type==='استشارة').length;
  const rev=S.pay.filter(x=>x.date===d).reduce((s,x)=>s+(+x.amount||0),0);
  let h=`<div class="kg">${kpi('في الانتظار',waitingN)}${kpi('كشوفات اليوم',examN)}${kpi('متابعات اليوم',followN)}${kpi('استشارات اليوم',consultN)}`;
  if(hide){h+=`<div class="box kp" style="cursor:pointer" onclick="S.showRev=!S.showRev;R()"><div class="kl">إجمالي المتحصلات اليوم ${S.showRev?'':'(اضغط للعرض)'}</div><div class="kv" style="color:#059669">${S.showRev?rev:'••••'}</div></div>`}
  else{const opsN=S.p.filter(p=>p.op?.name).length,itemsN=todayP.reduce((s,p)=>s+(p.charges?.length||0),0);h+=kpi('إجمالي المتحصلات اليوم',rev,'#059669')+kpi('عدد العمليات',opsN)+kpi('عدد البنود المضافة اليوم',itemsN)}
  return h+'</div>';
}
function view(){
  const v=S.v,srt=(a,k)=>[...a].sort((x,y)=>(x[k]||'')>(y[k]||'')?1:-1);
  const head=(t,btn='')=>`<div class="top"><h2 style="margin:0">${t}</h2>${btn}</div>`;
  if(v==='book')return head('الحجوزات',`<button class="btn" onclick="openP('new')">+ حجز جديد</button>`)+statsGrid(true)+grid(srt(list(['booked','confirmed']),'date'),p=>card(p,(p.status==='booked'?B('تأكيد',`mv('${p.id}','confirmed')`):'')+B('وصل العيادة',`openP('${p.id}','arrive')`,'g')+B('حذف',`del('${p.id}')`,'r')));
  if(v==='waiting')return head('قائمة الانتظار — شاشة الطبيب')+grid(srt(list(['waiting']),'num').sort((a,b)=>(a.num||0)-(b.num||0)),p=>examCard(p));
  if(v==='results')return head('انتظار نتائج (تحاليل / أشعة / أخرى)')+grid(list(['results']),p=>card({...p,badge:p.res?.type||'نتائج'},B('وصلت النتيجة — إعادة للانتظار',`mv('${p.id}','waiting')`)));
  if(v==='done')return head('تم الكشف')+grid(list(['done']),p=>card(p,B('إعادة كشف',`mv('${p.id}','waiting')`)+B('أرشفة',`mv('${p.id}','archive')`,'g')));
  if(v==='archive')return head('الأرشيف')+grid(list(['archive']),p=>card(p,B('إعادة فتح',`mv('${p.id}','waiting')`,'g')));
  if(v==='dash'){
    const d=today(),m=S.month||d.slice(0,7);
    const todayP=S.p.filter(p=>p.date===d),waitingN=list(['waiting']).length;
    const doneToday=S.p.filter(p=>p.status==='done'&&p.doneAt&&new Date(p.doneAt).toISOString().slice(0,10)===d).length;
    const revT=S.pay.filter(x=>x.date===d).reduce((s,x)=>s+(+x.amount||0),0),expT=S.exp.filter(x=>x.date===d).reduce((s,x)=>s+(+x.amount||0),0);
    const revM=S.pay.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+(+x.amount||0),0),expM=S.exp.filter(x=>x.date?.startsWith(m)).reduce((s,x)=>s+(+x.amount||0),0);
    const pM=S.p.filter(p=>p.date?.startsWith(m)).length;
    return head('الرئيسية')+`<div class="kg">${kpi('حجوزات اليوم',todayP.length)}${kpi('في الانتظار الآن',waitingN)}${kpi('تم الكشف اليوم',doneToday)}${kpi('إيراد اليوم',revT,'#059669')}${kpi('مصروف اليوم',expT,'#dc2626')}${kpi('صافي اليوم',revT-expT)}</div>`
    +`<div class="box" style="margin-top:16px"><div class="f"><div><label>عرض إحصائية شهر</label><input type="month" value="${m}" onchange="S.month=this.value;R()"></div></div></div>`
    +`<div class="kg">${kpi('عدد المرضى هذا الشهر',pM)}${kpi('إيراد الشهر',revM,'#059669')}${kpi('مصروف الشهر',expM,'#dc2626')}${kpi('صافي الشهر',revM-expM)}</div>`;
  }
  if(v==='ops'){
    const sub=S.ops2||'عمليات';
    const nav=`<div class="subnav">${['عمليات','فواتير','إقفال يومي','تقرير الموظفين'].map(t=>`<button class="btn s ${sub===t?'':'g'}" onclick="S.ops2='${t}';R()">${t}</button>`).join('')}</div>`;
    if(sub==='عمليات'){
      const a=S.p.filter(p=>p.op?.name),paid=a.reduce((s,p)=>s+(+p.op.paid||0),0),rem=a.reduce((s,p)=>s+(+p.op.total||0)-(+p.op.paid||0),0);
      return head('الحسابات',`<b>المحصّل: ${paid} — المتبقي: ${rem}</b>`)+statsGrid(false)+nav+grid(a,p=>{const t=+p.op.total||0,pd=+p.op.paid||0,r=t-pd;
        return card({...p,cls:r<=0?'ok':pd>0?'part':'red',badge:r<=0?'مسدد':pd>0?'مسدد جزئياً':'غير مسدد'},`<small style="width:100%">🔪 ${e(p.op.name)} (${e(p.op.type)})<br>الإجمالي ${t} • المدفوع ${pd} • المتبقي ${r}<br>📅 موعد العملية: ${e(p.op.date||'لم يحدد')}</small>`+B('سداد',`pay('${p.id}')`)+B('تحديد موعد',`opd('${p.id}')`,'g'))});
    }
    if(sub==='فواتير'){
      const a=S.p.filter(p=>p.charges?.some(c=>!c.paid));
      const tot=a.reduce((s,p)=>s+p.charges.filter(c=>!c.paid).reduce((s2,c)=>s2+(+c.amount||0),0),0);
      return head('الحسابات',`<b>إجمالي غير المسدد: ${tot}</b>`)+statsGrid(false)+nav+unpaidBox()+(a.length?a.map(p=>`<div class="box"><div class="row" style="border:0"><b>${e(p.name)}</b><span>${tag(p)}</span></div>${p.charges.filter(c=>!c.paid).map(c=>{const i=p.charges.indexOf(c);return `<div class="row"><span>${e(c.name||'بند')} — ${e(c.amount||0)}</span>${B('سداد',`payCharge('${p.id}',${i})`)}</div>`}).join('')}</div>`).join(''):'<div class="empty">لا توجد بنود غير مسددة</div>');
    }
    if(sub==='تقرير الموظفين'){
      const m=S.rp||'day',d=S.day||today(),mo=S.month||d.slice(0,7);

  if(q)[...S.p].sort((a,b)=>(b.date||'')>(a.date||'')?1:-1).forEach(p=>{const k=p.name+'|'+p.phone;if(!seen.has(k)&&((p.name||'').includes(q)||(p.phone||'').includes(q))){seen.add(k);SR.push(p)}});
  $('#sr').innerHTML=SR.slice(0,6).map((p,i)=>`<div class="row" style="cursor:pointer" onclick="pick(${i})"><span><b>${e(p.name)}</b> ${e(p.phone||'')} ${p.age?'— '+e(p.age)+' سنة':''}</span><span class="btn s">اختيار</span></div>`).join('')||(q?'<div class="empty" style="padding:8px">لا توجد نتائج</div>':'');
};
window.pick=i=>{const p=SR[i];Object.assign(D,{name:p.name,phone:p.phone||'',age:p.age||'',gender:p.gender||'',hist:p.hist||'',prevDiag:p.diag||''});M()};
function M(){
  const rec=mode==='arrive'||!PRE.includes(D.status),dr=isDoc()&&!PRE.includes(D.status),nw=!D.id;
  const al=D.rex?'🔁 إعادة كشف لمريض تم الكشف عليه من قبل':D.type!=='كشف جديد'?'🔁 نوع الزيارة: '+D.type:'';
  $('#modal').innerHTML=`<div class="mb"><div class="top"><h2>${nw?'حجز جديد':'ملف المريض'} ${D.num?`<span class="bd" style="--c:#7c3aed">رقم ${D.num}</span>`:''} <span class="bd ${D.status}">${ST[D.status]}</span> ${tag(D)}</h2><button class="btn g" onclick="closeM()">✕</button></div>
  ${dr&&D.status==='waiting'&&al?`<div class="alert">${al}${D.prevDiag?`<br>آخر تشخيص: ${e(D.prevDiag)}`:''}</div>`:''}
  <h4>بيانات الحجز</h4>${D.bookedBy?`<span class="chip">👤 حجز بواسطة: ${e(D.bookedBy)}</span>`:''}
  <div class="f"><div><label>نوع الزيارة</label><select onchange="setP('type',this.value);M()">${TYPES.map(t=>`<option ${D.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  ${nw&&D.type!=='كشف جديد'?`<label>ابحث عن المريض بالاسم أو الهاتف</label><input placeholder="ابدأ الكتابة..." oninput="srch(this.value)"><div id="sr"></div>`:''}
  <div class="f">${I('name','الاسم')}${I('phone','الهاتف')}${I('date','تاريخ الحجز','date')}${I('time','الوقت','time')}</div>
  <label>ملاحظات الحجز</label><textarea oninput="setP('notes',this.value)">${e(D.notes)}</textarea>
  ${rec?`<h4>${mode==='arrive'?'استكمال بيانات الاستقبال':'بيانات الاستقبال'}</h4><div class="f">${I('age','السن','number')}<div><label>النوع</label><select onchange="setP('gender',this.value)"><option></option>${['ذكر','أنثى'].map(g=>`<option ${D.gender===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
  <label>التاريخ المرضي / ملاحظات الاستقبال</label><textarea oninput="setP('hist',this.value)">${e(D.hist)}</textarea>
  <label>المستندات (تُحفظ على Google Drive)</label><input type="file" multiple onchange="up(this)">${D.files.map((f,i)=>`<div class="row"><a href="${e(f.url)}" target="_blank">📎 ${e(f.name)}</a><button class="btn s r" onclick="fdel(${i})">✕</button></div>`).join('')}
  ${S.u.role==='doctor'?'':`<label>تكلفة الزيارة (اختياري — بند واحد لتخصص واحد، أو أكثر من بند مثل الأسنان)</label>${chargeRows()}`}`:''}
  ${dr?`<h4>التشخيص</h4><textarea oninput="setP('diag',this.value)">${e(D.diag)}</textarea><div class="acts" style="margin-top:10px"><button class="btn" onclick="openRx()">💊 الروشتة (${D.rx.filter(r=>r.drug).length} دواء)</button><button class="btn g" onclick="openLab()">🔬 فحوصات خارجية (${(D.labs||[]).filter(Boolean).length})</button></div>
  <h4>انتظار نتائج</h4><div class="f"><div><label>النوع</label><select onchange="setP('res.type',this.value);M()"><option></option>${['تحاليل','أشعة','أخرى'].map(g=>`<option ${D.res.type===g?'selected':''}>${g}</option>`).join('')}</select></div>${I('res.note','تفاصيل المطلوب')}</div>
  <h4>عملية جراحية (تُحوَّل للحسابات)</h4><div class="f">${I('op.name','اسم العملية')}${I('op.type','نوع العملية')}${I('op.total','التكلفة','number')}${I('op.paid','المدفوع','number')}${I('op.date','موعد العملية','date')}</div>`:''}
  <div class="acts" style="margin-top:20px;border-top:1px solid var(--line);padding-top:14px">
  ${mode==='arrive'?`<button class="btn" onclick="sv('waiting')">✔ حفظ وتحويل للطبيب</button>`:`<button class="btn" onclick="sv()">💾 حفظ</button>`}
  ${!nw&&D.status==='booked'&&mode!=='arrive'?`<button class="btn g" onclick="sv('confirmed')">تأكيد الحجز</button>`:''}
  ${!nw&&PRE.includes(D.status)&&mode!=='arrive'?`<button class="btn g" onclick="toArrive()">وصل العيادة</button>`:''}
  ${dr&&!nw?`<button class="btn" style="background:#059669" onclick="sv('done')">✔ تم الكشف</button><button class="btn" style="background:#db2777" onclick="sv('results')" ${D.res.type?'':'disabled title="اختر نوع النتائج"'}>🧪 انتظار نتائج</button>`:''}</div></div>`;
}
window.M=M;
window.sv=async st=>{
  if(!D.name)return alert('اكتب اسم المريض');
  await regCharges();
  if(!D.id&&!D.bookedBy){D.bookedBy=S.u.name;D.bookedById=S.u.id}
  if(st)D.status=st;if(D.status==='waiting'&&!D.num)D.num=await nextNum();if(st==='done'){D.doneAt=Date.now();D.rex=false}
  const {id,...x}=D;if(id)await setDoc(doc(db,'patients',id),x);else await addDoc(collection(db,'patients'),x);closeM();
};
window.up=async inp=>{
  if(!APPS_URL)return alert('ضع رابط Apps Script في APPS_URL');inp.disabled=true;
  try{for(const f of inp.files){const b=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
    const j=await(await fetch(APPS_URL,{method:'POST',body:JSON.stringify({name:f.name,mime:f.type,data:b,patient:(D.num?D.num+' - ':'')+(D.name||'بدون اسم')})})).json();
    if(j.url)D.files.push({name:f.name,url:j.url});else alert(j.error||'فشل الرفع')}}catch(x){alert('فشل الرفع: '+x.message)}
  M();
};

window.openExam=async id=>{
  const p=S.p.find(x=>x.id===id);
  D={...BLANK(),...structuredClone(p)};D.res={...BLANK().res,...D.res};D.op={...BLANK().op,...D.op};D.chronic=D.chronic||[];mode='exam';opTab=false;
  if(D.status==='waiting'&&!D.num){D.num=await nextNum();updateDoc(doc(db,'patients',id),{num:D.num})}
  EM();$('#modal').style.display='flex';
};
window.toggleOpTab=()=>{opTab=!opTab;EM()};
window.toggleChr=c=>{D.chronic=D.chronic.includes(c)?D.chronic.filter(x=>x!==c):[...D.chronic,c];EM()};
window.delRx=async()=>{if(!confirm('حذف الروشتة؟'))return;D.rx=[];D.rxNote='';if(D.id)await updateDoc(doc(db,'patients',D.id),{rx:[],rxNote:''});EM()};
window.printRxOnly=()=>pr();
window.saveOp=async()=>{if(D.id)await updateDoc(doc(db,'patients',D.id),{op:D.op});alert('تم حفظ بيانات العملية، وستظهر في شاشة العمليات والحسابات')};
window.examSave=async st=>{
  await regCharges();
  const u={hist:D.hist,diag:D.diag,enotes:D.enotes,chronic:D.chronic,actions:D.actions||[],unpaid:!!D.unpaid,unpaidNote:D.unpaidNote||'',unpaidBy:D.unpaidBy||''};
  if(st){u.status=st;if(st==='done'){u.doneAt=Date.now();u.rex=false}}
  if(D.id)await updateDoc(doc(db,'patients',D.id),u);
  if(st)closeM();else alert('تم الحفظ');
};
function EM(){
  const al=D.rex?'🔁 إعادة كشف لمريض تم الكشف عليه من قبل':D.type!=='كشف جديد'?'🔁 نوع الزيارة: '+D.type:'';
  const hasRx=D.rx.filter(r=>r.drug).length;
  $('#modal').innerHTML=`<div class="mb"><div class="top"><h2>كشف المريض: ${e(D.name)} ${D.num?`<span class="bd" style="--c:#7c3aed">رقم ${D.num}</span>`:''} ${tag(D)}</h2><button class="btn g" onclick="closeM()">✕</button></div>
  ${al?`<div class="alert">${al}${D.prevDiag?`<br>آخر تشخيص: ${e(D.prevDiag)}`:''}</div>`:''}
  ${D.bookedBy?`<span class="chip">👤 حجز بواسطة: ${e(D.bookedBy)}</span>`:''}
  <label>التاريخ المرضي</label><textarea oninput="setP('hist',this.value)">${e(D.hist)}</textarea>
  <label>التشخيص</label><textarea oninput="setP('diag',this.value)">${e(D.diag)}</textarea>
  <label>ملاحظات</label><textarea oninput="setP('enotes',this.value)">${e(D.enotes)}</textarea>
  <label>أمراض مزمنة</label><div style="display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px">${CHR.map(c=>`<label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" style="width:auto" ${D.chronic.includes(c)?'checked':''} onchange="toggleChr('${c}')">${c}</label>`).join('')}</div>
  <h4>إجراءات مطلوبة بالعيادة</h4>${actionsBlock()}
  <h4>السداد</h4><label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" style="width:auto" ${D.unpaid?'checked':''} onchange="setP('unpaid',this.checked);setP('unpaidBy',S.u.name);EM()">⚠ كشف بدون سداد (لم يتم السداد)</label>${D.unpaid?`<input placeholder="سبب / ملاحظة (اختياري)" value="${e(D.unpaidNote||'')}" oninput="setP('unpaidNote',this.value)">`:''}
  <h4>الروشتة</h4>${hasRx?`<div class="acts">${B('✏ تعديل','openRx()')}${B('🖨 طباعة','printRxOnly()')}${B('🗑 حذف','delRx()','r')}</div>`:`<button class="btn g" onclick="openRx()">＋ إضافة روشتة</button>`}
  <h4>فحوصات خارجية</h4><button class="btn g" onclick="openLab()">🔬 فحوصات خارجية (${(D.labs||[]).filter(Boolean).length})</button>
  <h4 style="cursor:pointer" onclick="toggleOpTab()">${opTab?'▾':'◂'} تحديد عملية جراحية</h4>${opTab?`<div class="f">${I('op.name','اسم العملية')}${I('op.type','نوع العملية')}${I('op.total','التكلفة','number')}${I('op.paid','المدفوع','number')}${I('op.date','موعد العملية','date')}</div><button class="btn s" onclick="saveOp()">حفظ العملية</button>`:''}
  <div class="acts" style="margin-top:20px;border-top:1px solid var(--line);padding-top:14px">

window.openRx=()=>{if(!D.rx.length)D.rx.push({drug:'',times:'',note:''});RX();$('#rxm').style.display='flex'};
function RX(){
  $('#rxm').innerHTML=`<div class="mb"><div class="top"><h2>💊 الروشتة — ${e(D.name)}</h2><button class="btn g" onclick="closeRx()">✕</button></div>
  <datalist id="dl">${S.drugs.map(d=>`<option value="${e(d.name)}">`).join('')}</datalist>
  ${D.rx.map((r,i)=>`<div class="rxr"><input list="dl" placeholder="اسم الدواء (اكتب أول حروفه للتذكير)" value="${e(r.drug)}" oninput="rxDrug(${i},this.value)"><input id="rt${i}" placeholder="عدد المرات" value="${e(r.times)}" oninput="rxSet(${i},'times',this.value)"><input id="rn${i}" placeholder="توصيات" value="${e(r.note)}" oninput="rxSet(${i},'note',this.value)"><button class="btn s r" onclick="rxDel(${i})">✕</button></div>`).join('')}
  <button class="btn" onclick="rxAdd()">＋ إضافة دواء</button>
  <label>توصيات عامة</label><textarea oninput="setP('rxNote',this.value)">${e(D.rxNote)}</textarea>
  <div class="acts" style="margin-top:16px"><button class="btn g" onclick="saveRxClose()">💾 حفظ وإغلاق</button><button class="btn" onclick="printRx()">🖨 طباعة الروشتة</button></div></div>`;
}
window.rxSet=(i,k,v)=>{D.rx[i][k]=v};
window.rxDrug=(i,v)=>{const r=D.rx[i];r.drug=v;const d=S.drugs.find(x=>x.name.toLowerCase()===v.trim().toLowerCase());
  if(d){if(!r.times&&d.times){r.times=d.times;$('#rt'+i).value=d.times}if(!r.note&&d.note){r.note=d.note;$('#rn'+i).value=d.note}}};
window.rxAdd=()=>{D.rx.push({drug:'',times:'',note:''});RX()};
window.rxDel=i=>{D.rx.splice(i,1);RX()};
window.closeRx=()=>{$('#rxm').style.display='none';if(mode==='exam')EM();else M()};
window.saveRx=async()=>{
  D.rx=D.rx.filter(r=>r.drug.trim());
  for(const r of D.rx){const k=r.drug.trim().toLowerCase().replace(/[\/\s]+/g,'_');await setDoc(doc(db,'drugs',k),{name:r.drug.trim(),times:r.times||'',note:r.note||''},{merge:true})}
  if(D.id)await updateDoc(doc(db,'patients',D.id),{rx:D.rx,rxNote:D.rxNote||''});
};
window.saveRxClose=async()=>{await saveRx();closeRx()};
window.printRx=async()=>{await saveRx();pr()};
const DES=[['classic','كلاسيك'],['modern','عصري'],['framed','مؤطر']];

 const c=S.cfg,col=c.rxColor||'#0f766e',bg=S.rxbg.img,op=(c.rxOp??15)/100,d=des||c.rxDesign||'classic',sz=size||c.rxSize||'A4',w=open('','_blank');
 w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>طباعة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><style>

 .bg{position:fixed;inset:0;background:${bg?`url("${bg}") center/contain no-repeat`:'none'};opacity:${op};z-index:0}
 .pg{position:relative;z-index:1;padding:10mm 10mm 24mm}.h{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--c);padding-bottom:8px}.h img{height:${sz==='A5'?'55px':'75px'};max-width:180px;object-fit:contain}.h h1{margin:0;color:var(--c);font-size:22px}.h div{font-size:12px}
 .p{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;background:color-mix(in srgb,var(--c) 10%,#fff);padding:8px 12px;margin:10px 0;border-radius:8px;font-size:13px}
 .rx{font-size:40px;color:var(--c);font-weight:800;line-height:1}ol{padding-right:20px}li{margin:9px 0;font-size:16px}li small{display:block;color:#63777a;font-size:12px}
 .f{position:fixed;bottom:0;right:0;left:0;padding:7px 10mm;border-top:2px solid var(--c);text-align:center;font-size:11px;color:#63777a;z-index:1}
 .modern .h{background:var(--c);color:#fff;border:0;border-radius:0 0 14px 14px;margin:-10mm -10mm 0;padding:14px 10mm}.modern .h h1{color:#fff}.modern .h img{background:#fff;border-radius:10px;padding:4px}.modern li{background:#fff9;border-right:4px solid var(--c);padding:6px 10px;border-radius:6px;list-style-position:inside}.modern .f{background:var(--c);color:#fff;border:0}
 .framed .pg{margin:6mm;border:2px double var(--c);min-height:calc(100vh - 12mm);padding:8mm 8mm 22mm}.framed .h{flex-direction:column;text-align:center;border-bottom:1px solid var(--c)}.framed .f{right:6mm;left:6mm;bottom:6mm}
 </style></head><body class="${d}"><div class="bg"></div><div class="pg"><div class="h"><div><h1>${e(c.doctor||'')}</h1><div>${e(c.spec||'')}</div><div>${e(c.extra||'')}</div></div><img src="${LOGO()}" onerror="this.style.display='none'"></div>${body}</div>
 <div class="f">${[c.addr,c.phone&&'☎ '+c.phone,c.wa&&'واتساب '+c.wa,c.email,c.hours].filter(Boolean).map(e).join(' • ')}</div><script>onload=()=>setTimeout(print,600)<\/script></body></html>`);
 w.document.close();

const pinfo=()=>`<div class="p"><span>المريض: <b>${e(D.name)}</b>${D.age?' — '+e(D.age)+' سنة':''}</span><span>${today()}${D.num?' — رقم '+D.num:''}</span></div>`;

function LB(){
 const opts=v=>`<option value="">— اختر الفحص —</option>${[...new Set([...S.labItems.map(x=>x.name),...(v&&!S.labItems.some(x=>x.name===v)?[v]:[])])].map(n=>`<option ${n===v?'selected':''}>${e(n)}</option>`).join('')}<option value="__new">➕ إضافة فحص جديد...</option>`;

}
window.labPick=async(i,el)=>{let v=el.value;if(v==='__new'){v=(prompt('اسم الفحص الجديد')||'').trim();if(v)await labNew(v)}D.labs[i]=v;LB()};
window.labAdd=()=>{D.labs.push('');LB()};window.labDel=i=>{D.labs.splice(i,1);if(!D.labs.length)D.labs.push('');LB()};
window.saveLab=async()=>{D.labs=D.labs.filter(Boolean);if(D.id)await updateDoc(doc(db,'patients',D.id),{labs:D.labs,labNote:D.labNote||''})};
window.closeLab=()=>{$('#rxm').style.display='none';mode==='exam'?EM():M()};
window.saveLabClose=async()=>{await saveLab();closeLab()};
window.printLab=async()=>{await saveLab();printHTML(labBody(),'A5')};
window.setDes=k=>setDoc(doc(db,'settings','clinic'),{...S.cfg,rxDesign:k});
window.labCat=async()=>{const v=$('#labIn').value.trim();if(v)await labNew(v)};
window.labRm=i=>deleteDoc(doc(db,'labItems',labKey(S.labItems[i].name)));
window.rxBgDel=()=>setDoc(doc(db,'settings','rxbg'),{});
window.rxBgUp=inp=>{const im=new Image();im.onload=async()=>{for(const m of [1000,700,500]){const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);for(const t of ['image/png','image/webp']){const u=c.toDataURL(t,.85);if(u.length<900000)return setDoc(doc(db,'settings','rxbg'),{img:u})}}alert('الصورة كبيرة جدًا')};im.src=URL.createObjectURL(inp.files[0])};

const unpaidBox=()=>{const u=S.p.filter(p=>p.unpaid);return u.length?`<div class="box"><h3 style="margin-top:0">⚠ حالات تم الكشف عليها بدون سداد</h3>${u.map(p=>`<div class="row"><span><b>${e(p.name)}</b> — ${e(p.date||'')}${p.unpaidBy?' — بقرار: '+e(p.unpaidBy):''}${p.unpaidNote?'<br><small>'+e(p.unpaidNote)+'</small>':''}</span><span>${B('سداد',`payUnp('${p.id}')`)} ${B('إعفاء',`waive('${p.id}')`,'g')}</span></div>`).join('')}</div>`:''};
window.payUnp=async id=>{const p=S.p.find(x=>x.id===id),a=+prompt('المبلغ المسدد');if(!(a>0))return;const m=prompt('طريقة السداد','كاش')||'كاش';await addDoc(collection(db,'payments'),{pid:id,pname:p.name,item:'كشف (سداد متأخر)',amount:a,kind:'charge',method:m,date:today(),ts:Date.now(),by:S.u.name,byId:S.u.id});await updateDoc(doc(db,'patients',id),{unpaid:false})};
window.waive=id=>confirm('إعفاء الحالة من السداد؟')&&updateDoc(doc(db,'patients',id),{unpaid:false,waived:true});

boot();
</script></body></html>
